[package]
authors = ["YuantianDing <work.yt.ding@gmail.com>", "Chentian Wu <wuc9521@gmail.com>"]
description = "DryadSynth solver for bit manipulating programs"
edition = "2021"
homepage = "https://github.com/purdue-cap/DryadSynth"
include = ["/src", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/tree-sitter", "/rust-toolchain.toml"]
keywords = ["synthesis", "bit-manipulating", "dryadsynth", "bit-vector", "sygus"]
license = "MIT"
name = "dryadsynth-bv"
readme = "README.md"
repository = "https://github.com/purdue-cap/DryadSynth"
version = "0.1.3"

[dependencies]
bumpalo = "3.12.0"
bytemuck = "1.13.0"
clap = {version = "4.1.4", features = ["derive"]}
derive_more = "0.99.17"
dhat = { version = "0.3.2", optional = true }
either = "1.8.1"
extension-trait = "1.0.2"
figment = {version = "0.10.8", features = ["toml"]}
itertools = "0.4.3"
join-lazy-fmt = "0.9.2"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8.5"
rand_chacha = "0.3.1"
rsmt2 = "0.16.2"
sdset = "0.4.0"
separator = "0.4.1"
serde = {version = "1.0.152", features = ["derive"]}
smallvec = "1.10.0"
thiserror = "1.0.38"
tokio = {version = "1", features = ["macros", "rt-multi-thread"], optional = true}
tree-sitter = { version = "0.20.10", optional = true }
you-can = "0.0.14"
iter_fixed = "0.3.1"
lazy_static = "1.5.0"
openai = { version = "1.0.0-alpha.13", optional = true }
spin = "0.9.8"
rustc-hash = "1.1.0"
sygus-parser = "0.1.6"

[features]
dhat-heap = ["dep:dhat"]
chatgpt = ["dep:openai", "dep:tokio", "dep:tree-sitter"]

[build-dependencies]
cc = "1.2.17"
